        /* ------------------------------------------------------------------
           Playable Video - responsive stage
           The stage reserves the space for the video. Its height comes from
           percentage padding (__HEIGHT__ / __WIDTH__ = __RATIO__%), which is always
           resolved against the stage's own container width. Viewport units (vw)

           ------------------------------------------------------------------ */
        @media only screen and (max-device-width: __WIDTH__px),
        only screen and (max-width: __WIDTH__px) {

            .-pl-stage- {
                display: block !important;
                width: 100% !important;

                margin: 0 auto !important;
            }

            .-pl-stage- div,
            .-pl-stage- a,
            .-pl-stage- video,
            .-pl-stage- img {
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
            }

            /* for clients that lay out a video before its metadata arrives */
            .-pl-stage- video,
            .-pl-stage- img {
                aspect-ratio: __WIDTH__ / __HEIGHT__;
            }
        }

        @media (-webkit-video-playable-inline) {
            *[playable] video {
                display: block !important;

               iPhone/iPad passes the inline-video test but won't play video, and
               it drops the attribute or attribute selectors, so it skips both
               rules here and keeps showing the animated image */
            *[playable] .-playable-video {
                display: none !important;

            /* Outlook on iPhone/iPad also keeps the sound layer, a video it will not

               link. A plain rule hides the layer, and a playable-attribute rule, which
               that app skips, brings it back everywhere else */
            .-pl-vws- {
                display: none !important;
            }

            *[playable] .-pl-vws- {
                display: block !important;
            }
        }
